name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0); defaults to the pushed tag'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.95"   # workspace MSRV

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: codegraph-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: codegraph-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: codegraph-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: codegraph-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: codegraph-windows-x86_64

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (${{ env.RUST_TOOLCHAIN }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable sccache GitHub Actions backend
        run: echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Build codegraph
        run: cargo build --profile release-dist --target ${{ matrix.target }} -p codegraph-mcp-server --bin codegraph --features full

      - name: Package archive and checksum
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release-dist/codegraph"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "${BIN}.exe" "${{ matrix.name }}.exe"
            7z a "${{ matrix.name }}.zip" "${{ matrix.name }}.exe"
            ASSET="${{ matrix.name }}.zip"
          else
            cp "$BIN" "${{ matrix.name }}"
            tar czf "${{ matrix.name }}.tar.gz" "${{ matrix.name }}"
            ASSET="${{ matrix.name }}.tar.gz"
          fi
          (shasum -a 256 "$ASSET" > "$ASSET.sha256") || (sha256sum "$ASSET" > "$ASSET.sha256")
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
