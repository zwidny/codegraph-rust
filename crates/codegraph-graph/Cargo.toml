[package]
name = "codegraph-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Graph data structures and operations for CodeGraph"

[dependencies]
codegraph-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }

# SurrealDB support (optional, default on via feature flag)
surrealdb = { version = "4.0.1", optional = true, features = ["kv-mem", "kv-surrealkv", "protocol-http"] }
dotenvy = { version = "0.15.7", optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread"] }

# Postgres/pgvector scaffolding for the migration evaluated in docs/BACKEND_EVALUATION.md.
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1"] }
deadpool-postgres = { version = "0.14", optional = true }
bytes = { version = "1", optional = true }

[features]
default = []
surrealdb = ["dep:surrealdb", "dep:dotenvy", "dep:tokio"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:bytes", "dep:tokio"]

[[bin]]
name = "surreal_smoke_test"
path = "src/bin/surreal_smoke_test.rs"
required-features = ["surrealdb"]

[dev-dependencies]
tempfile = { workspace = true }
