[package]
name = "codegraph-mcp-server"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Solita CodeGraph"]
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
default = ["daemon", "postgres"]
ai-enhanced = ["codegraph-mcp/ai-enhanced"]
server-http = ["dep:axum", "dep:hyper", "dep:tower", "dep:http-body-util", "dep:tokio-util"]
embeddings = ["codegraph-mcp-tools/embeddings", "codegraph-mcp/embeddings"]
embeddings-ollama = ["embeddings", "codegraph-mcp/embeddings-ollama"]
embeddings-openai = ["embeddings", "codegraph-mcp/embeddings-openai"]
embeddings-jina = ["embeddings", "codegraph-mcp/embeddings-jina"]
embeddings-lmstudio = ["embeddings", "codegraph-mcp/embeddings-lmstudio"]
embeddings-local = ["embeddings", "codegraph-mcp/embeddings-local"]
all-embeddings = [
    "embeddings-ollama",
    "embeddings-openai",
    "embeddings-jina",
    "embeddings-lmstudio",
    "embeddings-local"
]
daemon = ["dep:codegraph-mcp-daemon"]
# Write the graph to Postgres/pgvector instead of SurrealDB (CODEGRAPH_BACKEND)
postgres = ["codegraph-mcp/postgres"]
# Compile the SurrealDB backend and its schema canaries (opt-in).
surrealdb = [
    "codegraph-mcp/surrealdb",
    "codegraph-mcp-tools/surrealdb",
    "codegraph-vector/surrealdb",
    "codegraph-graph/surrealdb",
    "dep:surrealdb",
]
# Full features for cargo install --features full
full = [
    "daemon",
    "ai-enhanced",
    "server-http",
    "all-embeddings"
]

[dependencies]
codegraph-mcp-core = { path = "../codegraph-mcp-core" }
codegraph-mcp-tools = { path = "../codegraph-mcp-tools" }
codegraph-mcp-daemon = { path = "../codegraph-mcp-daemon", optional = true }
codegraph-core = { path = "../codegraph-core" }
codegraph-graph = { path = "../codegraph-graph" }
codegraph-vector = { path = "../codegraph-vector" }
rmcp = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
http-body-util = { version = "0.1.5", optional = true }
tokio-util = { version = "0.7.19", optional = true }
colored = { workspace = true }
indicatif = { workspace = true }
atty = { workspace = true }
chrono = { workspace = true }
tracing-subscriber = { workspace = true }
serde_yaml = "0.9.34"
anyhow = { workspace = true }
codegraph-mcp = { path = "../codegraph-mcp" }
tracing-appender = { workspace = true }
dirs = "7.0.0"
dotenv = "0.15.0"
nix = { version = "0.31.3", features = ["process", "signal"] }

surrealdb = { version = "4.0.1", features = ["kv-mem", "kv-surrealkv"], optional = true }
[dev-dependencies]
tokenizers = { workspace = true }
serial_test = "4.0.1"
tempfile = { workspace = true }
